<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<title>Approved sites</title>
<style>
  :root { color-scheme: dark; --bg: #1b1e24; --ink: #e8e4dc; --mute: #9aa0aa; --line: #2c3038; --sage: #84b3a6; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 56px; overflow: hidden; background: var(--bg); color: var(--ink); font: 600 14px/1.2 "Segoe UI", system-ui, sans-serif; }
  .bar { height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 2px solid var(--line); }
  button, select { font: inherit; color: var(--ink); }
  button { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border: 0; border-radius: 10px; background: transparent; cursor: pointer; }
  button:hover:not(:disabled) { background: #2a2e36; }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--sage); outline-offset: 1px; }
  svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  select { height: 40px; min-width: 0; max-width: 260px; padding: 0 10px; border: 2px solid var(--line); border-radius: 10px; background: #23272f; }
  .title { min-width: 0; flex: 1; color: var(--mute); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { flex: none; padding: 6px 10px; border-radius: 999px; background: var(--sage); color: #14201c; font-size: 12px; font-weight: 800; letter-spacing: .04em; }
  .done { width: auto; padding: 0 14px; border: 2px solid var(--line); font-weight: 700; }
</style>
</head>
<body>
  <div class="bar" role="toolbar" aria-label="Approved sites">
    <button id="back" type="button" aria-label="Back" title="Back" disabled><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button>
    <button id="forward" type="button" aria-label="Forward" title="Forward" disabled><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
    <button id="reload" type="button" aria-label="Reload" title="Reload"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg></button>
    <label class="sr" for="site" style="position:absolute;left:-9999px">Approved site</label>
    <select id="site" aria-label="Approved sites"></select>
    <span class="title" id="title" aria-live="polite"></span>
    <span class="badge">STRICT FOCUS</span>
    <button id="done" class="done" type="button">Done</button>
  </div>
  <script src="sites-bar.js"></script>
</body>
</html>

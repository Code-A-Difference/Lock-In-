<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<title>LOCK IN! (floating)</title>
<style>
  /* A pill, not a window: the timer, small enough to forget about. Hover for its buttons.
     When music plays, a second part joins it: waves, the title, pause and skip. Drag it anywhere. */
  :root { color-scheme: dark; --bg: #1b1e24; --ink: #e8e4dc; --mute: #9aa0aa; --line: #2c3038; --sage: #84b3a6; --rec: #e5484d; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; font: 600 12px/1 "Space Grotesk Variable", "Segoe UI", system-ui, sans-serif; color: var(--ink); user-select: none; }
  .bar { position: absolute; left: 3px; top: 3px; height: 28px; width: max-content; display: flex; align-items: center; gap: 0;
    background: var(--bg); border: 1px solid var(--line); border-radius: 14px; -webkit-app-region: drag; box-shadow: 0 3px 10px rgba(0,0,0,.4); overflow: hidden; }
  .seg { display: flex; align-items: center; gap: 6px; height: 100%; padding: 0 9px; white-space: nowrap; }
  .seg + .seg { border-left: 1px solid var(--line); padding-left: 8px; }
  .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--mute); }
  .dot.rec { background: var(--rec); animation: beat 1.6s ease-in-out infinite; }
  .dot.focus { background: var(--sage); }
  .dot.paused { background: #d9a441; animation: none; }
  @keyframes beat { 50% { opacity: .35; } }
  .time { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .label { max-width: 90px; overflow: hidden; text-overflow: ellipsis; color: var(--mute); font-size: 11px; display: none; }
  button { -webkit-app-region: no-drag; flex: none; display: grid; place-items: center; width: 22px; height: 22px; border: 0; border-radius: 7px;
    background: transparent; color: var(--ink); cursor: pointer; }
  button:hover { background: #2a2e36; }
  button:focus-visible { outline: 2px solid var(--sage); outline-offset: 0; }
  button.main { background: var(--sage); color: #14201c; }
  button.main:hover { background: #95c1b5; }
  .ctl { display: none; align-items: center; gap: 2px; }
  .bar:hover .ctl, .bar:focus-within .ctl { display: flex; }
  .bar:hover .label, .bar:focus-within .label { display: block; }
  [hidden] { display: none !important; }
  svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  svg.fill { fill: currentColor; stroke-width: 1.5; }

  .waves { flex: none; display: inline-flex; align-items: flex-end; gap: 1.5px; height: 11px; color: var(--sage); }
  .waves i { display: block; width: 2px; height: 3px; border-radius: 1px; background: currentColor; }
  .waves.on i { animation: wave 900ms ease-in-out infinite; }
  .waves.on i:nth-child(2) { animation-delay: -.45s; animation-duration: 760ms; }
  .waves.on i:nth-child(3) { animation-delay: -.2s; animation-duration: 1040ms; }
  .waves.on i:nth-child(4) { animation-delay: -.65s; animation-duration: 820ms; }
  @keyframes wave { 0%, 100% { height: 3px; } 50% { height: 11px; } }
  .song { max-width: 128px; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; font-size: 12px; font-weight: 600; }
  @media (prefers-reduced-motion: reduce) { .dot.rec { animation: none; } .waves.on i { animation: none; height: 7px; } }
</style>
</head>
<body>
  <div class="bar" id="bar" role="toolbar" aria-label="LOCK IN!">
    <div class="seg" id="seg-timer">
      <span class="dot" id="dot" aria-hidden="true"></span>
      <span class="time" id="time" aria-live="off">0:00</span>
      <span class="label" id="label"></span>
      <span class="ctl">
        <button id="toggle" class="main" type="button" aria-label="Start focus" title="Start focus">
          <svg id="ico-play" class="fill" viewBox="0 0 24 24"><polygon points="7 4 20 12 7 20 7 4"/></svg>
          <svg id="ico-pause" class="fill" viewBox="0 0 24 24" hidden><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        </button>
        <button id="stop" type="button" aria-label="Stop recording" title="Stop recording" hidden>
          <svg class="fill" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
        <button id="ask" type="button" aria-label="Ask Companion" title="Ask Companion">
          <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <button id="expand" type="button" aria-label="Open the full window" title="Full window">
          <svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
        </button>
      </span>
    </div>
    <div class="seg" id="seg-music" hidden>
      <span class="waves" id="waves" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="song" id="song"></span>
      <button id="m-toggle" type="button" aria-label="Pause music" title="Pause music">
        <svg id="m-play" class="fill" viewBox="0 0 24 24" hidden><polygon points="7 4 20 12 7 20 7 4"/></svg>
        <svg id="m-pause" class="fill" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      </button>
      <button id="m-next" type="button" aria-label="Next song" title="Next song">
        <svg class="fill" viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><rect x="17" y="5" width="3" height="14" rx="1"/></svg>
      </button>
    </div>
  </div>
  <script src="mini.js"></script>
</body>
</html>

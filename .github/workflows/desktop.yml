# Builds the LOCK IN! desktop app (desktop/) for Windows and Mac.
#
#  windows  LOCKIN-win-x64.exe, with whisper.cpp's official Windows build of
#           whisper-server inside it for on-device transcription
#  mac      LOCKIN-mac-arm64.dmg and LOCKIN-mac-x64.dmg, with whisper-server
#           built here from the same whisper.cpp release (Metal on Apple chips)
#
# Neither is signed with a paid certificate: Windows SmartScreen and macOS
# Gatekeeper ask once ("Run anyway" / "Open Anyway"). The Mac build is
# ad-hoc signed so Apple-chip Macs will run it at all.
#
# Runs by hand and on desktop-v* tags, which attach the builds to a GitHub
# release. That release is NOT marked "latest", so the Android download link
# (releases/latest/download/LOCKIN-android.apk) keeps pointing at the phone app.

name: Desktop app

on:
  push:
    tags: ['desktop-v*']
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  WHISPER_TAG: b5454

jobs:
  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: desktop, shell: bash } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: whisper-server (official whisper.cpp Windows build)
        run: |
          curl -sSLf -o w.zip "https://github.com/ggml-org/whisper.cpp/releases/download/$WHISPER_TAG/whisper-bin-x64.zip"
          unzip -q w.zip -d w
          mkdir -p resources/whisper/win-x64
          cp w/Release/whisper-server.exe w/Release/whisper.dll w/Release/ggml*.dll resources/whisper/win-x64/
          resources/whisper/win-x64/whisper-server.exe --help > /dev/null
      - run: npm run dist:win
      - uses: actions/upload-artifact@v7
        with: { name: windows, path: desktop/dist/LOCKIN-win-x64.exe, if-no-files-found: error }

  mac:
    runs-on: macos-latest
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: whisper-server for Apple chips and Intel
        run: |
          git clone --depth 1 --branch "$WHISPER_TAG" https://github.com/ggml-org/whisper.cpp "$RUNNER_TEMP/whisper.cpp"
          W="$RUNNER_TEMP/whisper.cpp"
          COMMON="-DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_SDL2=OFF -DGGML_NATIVE=OFF -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0"
          cmake -S "$W" -B "$W/b-arm" $COMMON -DCMAKE_OSX_ARCHITECTURES=arm64 -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON
          cmake --build "$W/b-arm" --target whisper-server -j 4
          cmake -S "$W" -B "$W/b-x64" $COMMON -DCMAKE_OSX_ARCHITECTURES=x86_64 -DGGML_METAL=OFF
          cmake --build "$W/b-x64" --target whisper-server -j 4
          mkdir -p resources/whisper/mac-arm64 resources/whisper/mac-x64
          cp "$W/b-arm/bin/whisper-server" resources/whisper/mac-arm64/
          cp "$W/b-x64/bin/whisper-server" resources/whisper/mac-x64/
          file resources/whisper/mac-*/whisper-server
          otool -L resources/whisper/mac-arm64/whisper-server
          resources/whisper/mac-arm64/whisper-server --help > /dev/null
      - run: npx electron-builder --mac dmg --arm64 --x64 --publish never
      - uses: actions/upload-artifact@v7
        with: { name: mac, path: 'desktop/dist/LOCKIN-mac-*.dmg', if-no-files-found: error }

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [windows, mac]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with: { path: out, merge-multiple: true }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd out
          sha256sum LOCKIN-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --latest=false \
            --title "LOCK IN! desktop ${GITHUB_REF_NAME#desktop-v}" \
            --notes "LOCK IN! for Windows and Mac: on-device transcription, a floating window, computer-audio recording, call detection and global shortcuts. Windows: run LOCKIN-win-x64.exe (SmartScreen: More info → Run anyway). Mac: open the .dmg for your chip, drag LOCK IN! to Applications, then right-click → Open the first time (or System Settings → Privacy & Security → Open Anyway)."
          gh release upload "$GITHUB_REF_NAME" LOCKIN-* SHA256SUMS.txt --clobber
